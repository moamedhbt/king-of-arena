<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1226" />
    <title>ملك الحلبة</title>
    <style>
      :root {
        --bg: #0a1226;
        --bg2: #101c38;
        --teal: #16d3c4;
        --teal2: #0b7d78;
        --sand: #f2e7c9;
        --ink: #eaf2ff;
        --dim: #8ba0c4;
        --danger: #ff5a5f;
        --gold: #ffd23f;
        --card: rgba(14, 26, 51, 0.92);
        --line: rgba(90, 200, 220, 0.22);
        --font: 'SF Arabic', 'Geeza Pro', 'Noto Kufi Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        background: var(--bg); color: var(--ink); font-family: var(--font);
        user-select: none; -webkit-user-select: none; touch-action: none;
      }
      #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      .hidden { display: none !important; }
      .screen {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        pointer-events: auto; padding: 18px;
        background: radial-gradient(120% 90% at 50% 0%, rgba(22, 211, 196, 0.12), transparent 60%),
          linear-gradient(180deg, rgba(6, 12, 26, 0.72), rgba(6, 12, 26, 0.94));
        backdrop-filter: blur(3px);
      }
      .card {
        background: var(--card); border: 1px solid var(--line); border-radius: 18px;
        padding: 18px; width: min(430px, 100%); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      }
      h1 { font-size: 34px; margin: 0; letter-spacing: 1px; }
      h1 .sub { display: block; font-size: 13px; color: var(--teal); font-weight: 400; letter-spacing: 2px; margin-top: 6px; }
      label { display: block; font-size: 13px; color: var(--dim); margin: 12px 0 6px; }
      input {
        width: 100%; padding: 13px 14px; border-radius: 12px; font-size: 17px;
        background: #0b1730; border: 1px solid var(--line); color: var(--ink);
        font-family: inherit; outline: none; text-align: right;
      }
      input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(22, 211, 196, 0.15); }
      input.code { text-align: center; letter-spacing: 10px; font-size: 24px; font-weight: 700; text-transform: uppercase; }
      button {
        font-family: inherit; font-size: 17px; font-weight: 700; border: 0; border-radius: 12px;
        padding: 14px 18px; cursor: pointer; width: 100%; color: #04201f;
        background: linear-gradient(180deg, #2ee6d6, #10a89c); transition: transform 0.08s, filter 0.15s;
      }
      button:active { transform: scale(0.98); }
      button:disabled { filter: grayscale(0.7) brightness(0.7); cursor: not-allowed; }
      button.ghost {
        background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500;
      }
      button.small { font-size: 14px; padding: 9px 12px; width: auto; }
      .row { display: flex; gap: 8px; align-items: center; }
      .row > * { flex: 1; }
      .err { color: var(--danger); font-size: 13px; min-height: 18px; text-align: center; }
      .hint { color: var(--dim); font-size: 12px; text-align: center; margin-top: 8px; line-height: 1.7; }
      .code-big {
        font-size: 44px; font-weight: 800; letter-spacing: 12px; text-align: center;
        color: var(--sand); text-shadow: 0 0 22px rgba(22, 211, 196, 0.5); direction: ltr;
      }
      .players { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
      .prow {
        display: flex; align-items: center; gap: 10px; padding: 9px 12px;
        background: rgba(255, 255, 255, 0.04); border-radius: 12px; font-size: 15px;
      }
      .dot { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
      .tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: rgba(22, 211, 196, 0.18); color: var(--teal); }
      .tag.off { background: rgba(255, 90, 95, 0.15); color: var(--danger); }
      .seg { display: flex; gap: 6px; }
      .seg button {
        background: #0b1730; color: var(--dim); border: 1px solid var(--line);
        font-weight: 600; padding: 10px; font-size: 15px;
      }
      .seg button.on { background: linear-gradient(180deg, #2ee6d6, #10a89c); color: #04201f; border-color: transparent; }

      /* ---------- HUD ---------- */
      #hud-top {
        position: absolute; top: 0; right: 0; left: 0; display: flex; justify-content: space-between;
        align-items: flex-start; padding: 10px 12px; gap: 10px; pointer-events: none;
      }
      .pill {
        background: rgba(9, 18, 36, 0.82); border: 1px solid var(--line); border-radius: 999px;
        padding: 7px 14px; font-size: 13px; display: flex; align-items: center; gap: 8px;
        backdrop-filter: blur(6px);
      }
      .pill b { font-size: 15px; }
      .timer b { color: var(--teal); font-variant-numeric: tabular-nums; min-width: 34px; display: inline-block; text-align: center; }
      #overlayHost {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        padding: 10px; pointer-events: auto; background: rgba(4, 9, 20, 0.55);
        backdrop-filter: blur(3px); z-index: 20;
      }
      #overlayHost:empty { display: none; }
      #scoreboard {
        position: absolute; top: 64px; left: 10px; width: 158px; display: flex; flex-direction: column; gap: 4px;
        pointer-events: none;
      }
      #scoreboard .srow {
        display: flex; align-items: center; gap: 6px; font-size: 12px;
        background: rgba(9, 18, 36, 0.72); border-radius: 8px; padding: 4px 8px;
        border-right: 3px solid transparent;
      }
      #scoreboard .srow.me { background: rgba(22, 211, 196, 0.16); }
      #scoreboard .srow.dead { opacity: 0.42; }
      #scoreboard .srow .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #scoreboard .srow .sc { font-weight: 700; font-variant-numeric: tabular-nums; }

      /* ---------- controls ---------- */
      #controls { position: absolute; inset: 0; pointer-events: none; }
      #joystick {
        position: absolute; bottom: 26px; right: 22px; width: 132px; height: 132px; border-radius: 50%;
        background: rgba(12, 24, 46, 0.5); border: 2px solid rgba(22, 211, 196, 0.28);
        pointer-events: auto; touch-action: none;
      }
      #stick {
        position: absolute; width: 56px; height: 56px; border-radius: 50%; left: 50%; top: 50%;
        transform: translate(-50%, -50%); background: radial-gradient(circle at 35% 30%, #5ff0e2, #0d8f88);
        box-shadow: 0 0 18px rgba(22, 211, 196, 0.5);
      }
      #actions { position: absolute; bottom: 34px; left: 22px; display: flex; gap: 14px; pointer-events: auto; }
      .abtn {
        width: 78px; height: 78px; border-radius: 50%; border: 2px solid rgba(22, 211, 196, 0.35);
        background: rgba(12, 24, 46, 0.72); color: var(--ink); font-size: 13px; font-weight: 700;
        display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
        padding: 0;
      }
      .abtn .fill {
        position: absolute; inset: 0; background: rgba(22, 211, 196, 0.22);
        transform-origin: bottom; pointer-events: none;
      }
      .abtn.ready { border-color: var(--teal); box-shadow: 0 0 16px rgba(22, 211, 196, 0.35); }
      .abtn span { position: relative; z-index: 1; }
      .abtn.item { background: rgba(255, 210, 63, 0.14); border-color: rgba(255, 210, 63, 0.5); }
      .abtn.item.empty { opacity: 0.35; }

      /* ---------- puzzle ---------- */
      #overlay {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(4, 9, 20, 0.74); pointer-events: auto; padding: 12px; backdrop-filter: blur(4px);
      }
      .panel {
        background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px;
        width: min(520px, 100%); max-height: 92vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      }
      .panel h2 { margin: 0 0 4px; font-size: 20px; }
      .panel .sub { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
      canvas.puzzle { width: 100%; height: auto; border-radius: 12px; background: #071021; display: block; }
      .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
      .opt {
        padding: 16px; font-size: 22px; font-weight: 800; border-radius: 12px; text-align: center;
        background: #0d1a34; border: 1px solid var(--line); color: var(--ink); font-variant-numeric: tabular-nums;
      }
      .opt.correct { background: rgba(46, 230, 214, 0.25); border-color: var(--teal); }
      .opt.wrong { background: rgba(255, 90, 95, 0.22); border-color: var(--danger); }
      .opt:disabled { opacity: 0.55; }
      .locked { text-align: center; color: var(--danger); font-size: 13px; height: 18px; margin-top: 8px; }
      .memgrid { display: grid; gap: 8px; margin: 8px auto; justify-content: center; }
      .memcell {
        width: clamp(46px, 13vw, 74px); height: clamp(46px, 13vw, 74px); border-radius: 12px;
        background: #0d1a34; border: 1px solid var(--line); display: flex; align-items: center;
        justify-content: center; font-size: 22px; font-weight: 800; color: var(--teal);
      }
      .memcell.flash { background: radial-gradient(circle, #6ff6e6, #12a99f); color: #04201f; }
      .memcell.picked { background: rgba(22, 211, 196, 0.22); border-color: var(--teal); }
      .oddwrap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .oddcell { background: #0d1a34; border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
      .oddcell.sel { border-color: var(--teal); background: rgba(22, 211, 196, 0.14); }
      .oddcell svg { display: block; width: 100%; height: auto; }

      /* ---------- draft ---------- */
      .items { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
      .item {
        background: #0d1a34; border: 1px solid var(--line); border-radius: 14px; padding: 12px;
        text-align: center; cursor: pointer; pointer-events: auto;
      }
      .item.sel { border-color: var(--teal); background: rgba(22, 211, 196, 0.16); }
      .item.out { opacity: 0.4; }
      .item .ico { font-size: 26px; line-height: 1.1; }
      .item .nm { font-weight: 700; margin-top: 2px; font-size: 15px; }
      .item .st { font-size: 11px; color: var(--dim); margin-top: 2px; }
      .item .st.hot { color: var(--gold); }
      .item .dsc { font-size: 11px; color: var(--dim); margin-top: 6px; line-height: 1.5; }

      /* ---------- results ---------- */
      .rtable { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
      .rtable .r {
        display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center;
        background: rgba(255, 255, 255, 0.04); border-radius: 10px; padding: 9px 10px; font-size: 14px;
      }
      .rtable .r.top { background: rgba(255, 210, 63, 0.14); }
      .rtable .r .rank { font-weight: 800; color: var(--gold); text-align: center; }
      .rtable .r .who { display: flex; flex-direction: column; gap: 2px; }
      .rtable .r .why { font-size: 11px; color: var(--dim); }
      .rtable .r .pts { font-weight: 800; font-variant-numeric: tabular-nums; }
      .rtable .r .pts small { display: block; font-weight: 400; font-size: 10px; color: var(--dim); }
      .podium { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin: 18px 0; }
      .podium .p { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .podium .p .bar {
        width: 74px; border-radius: 10px 10px 0 0; display: flex; align-items: center;
        justify-content: center; font-weight: 800; font-size: 20px; color: #04201f;
      }
      .podium .p .nm { font-size: 12px; max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .badge {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(9, 18, 36, 0.9); border: 1px solid var(--line); border-radius: 14px;
        padding: 14px 22px; font-size: 16px; text-align: center; pointer-events: none;
      }
      #toast {
        position: absolute; top: 92px; left: 50%; transform: translateX(-50%);
        display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none;
      }
      .toast {
        background: rgba(9, 18, 36, 0.92); border: 1px solid var(--line); border-radius: 999px;
        padding: 7px 16px; font-size: 13px; animation: pop 0.25s ease-out;
      }
      @keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      #spectator {
        position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
        background: rgba(9, 18, 36, 0.9); border: 1px solid var(--line); border-radius: 12px;
        padding: 10px 14px; font-size: 13px; text-align: center; pointer-events: auto; max-width: 92vw;
      }
      #spectator .plist { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
      #spectator .plist button { width: auto; padding: 6px 12px; font-size: 12px; border-radius: 999px; }
      .sound-toggle {
        position: absolute; bottom: 172px; right: 16px; width: 40px; height: 40px; border-radius: 50%;
        background: rgba(9, 18, 36, 0.8); border: 1px solid var(--line); color: var(--ink);
        font-size: 16px; pointer-events: auto; display: flex; align-items: center; justify-content: center;
        padding: 0;
      }
      #rotate-hint {
        position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
        background: var(--bg); z-index: 50; text-align: center; padding: 30px; font-size: 16px;
      }
      @media (orientation: portrait) and (max-height: 500px) { #rotate-hint { display: flex; } }
      @media (max-width: 520px) {
        #scoreboard { width: 132px; top: 58px; }
        #scoreboard .srow { font-size: 11px; padding: 3px 6px; }
        .pill { font-size: 12px; padding: 6px 11px; }
        .abtn { width: 68px; height: 68px; font-size: 12px; }
        #joystick { width: 118px; height: 118px; }
        .sound-toggle { bottom: 152px; right: 12px; }
        h1 { font-size: 28px; }
      }
      .item .ico svg, .abtn svg { display: block; margin: 0 auto; }
      .rtable .r .pts { direction: ltr; }
      .live { color: var(--teal); }
      .kv { display: flex; justify-content: space-between; font-size: 13px; color: var(--dim); padding: 4px 0; }
      .kv b { color: var(--ink); }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="ui">
      <!-- الرئيسية -->
      <section id="screen-home" class="screen">
        <div class="card">
          <h1>ملك الحلبة <span class="sub">ذكاء · مهارة · حلبة</span></h1>
          <label for="nameInput">اسمك</label>
          <input id="nameInput" maxlength="12" placeholder="حتى 12 حرفًا" autocomplete="off" />
          <div style="height: 12px"></div>
          <button id="createBtn">أنشئ غرفة</button>
          <div style="height: 18px"></div>
          <label for="codeInput">أو انضم بكود صديقك</label>
          <div class="row">
            <input id="codeInput" class="code" maxlength="4" placeholder="ABCD" autocomplete="off" />
            <button id="joinBtn" style="flex: 0 0 110px">انضم</button>
          </div>
          <div class="err" id="homeErr"></div>
          <div class="hint">2 إلى 8 لاعبين · بلا حسابات · رابط دعوة واحد</div>
        </div>
      </section>

      <!-- اللوبي -->
      <section id="screen-lobby" class="screen hidden">
        <div class="card">
          <div class="hint">كود الغرفة</div>
          <div class="code-big" id="lobbyCode">----</div>
          <div class="row" style="margin-top: 12px">
            <button class="ghost small" id="copyLinkBtn">نسخ رابط الدعوة</button>
            <button class="ghost small" id="copyCodeBtn">نسخ الكود</button>
          </div>
          <label style="margin-top: 16px">عدد الجولات</label>
          <div class="seg" id="roundsSeg">
            <button data-rounds="3" class="on">3</button>
            <button data-rounds="5">5</button>
            <button data-rounds="7">7</button>
          </div>
          <label style="margin-top: 16px">اللاعبون <span id="playerCount" style="color: var(--teal)">0</span>/8</label>
          <div class="players" id="lobbyPlayers"></div>
          <div style="height: 14px"></div>
          <button id="startBtn" disabled>ابدأ المباراة</button>
          <div class="hint" id="lobbyHint">بانتظار صاحب الغرفة…</div>
        </div>
      </section>

      <!-- اللعب -->
      <section id="screen-game" class="hidden">
        <div id="hud-top">
          <div class="pill"><span id="phaseName">—</span></div>
          <div class="pill timer"><span id="roundLabel">جولة 1/3</span> · <b id="timerVal">0</b></div>
        </div>
        <div id="scoreboard"></div>
        <div id="controls">
          <div id="joystick"><div id="stick"></div></div>
          <div id="actions">
            <button class="abtn" id="dashBtn"><span>اندفاع</span><div class="fill" id="dashFill"></div></button>
            <button class="abtn item" id="itemBtn"><span id="itemLabel">—</span></button>
          </div>
        </div>
        <div id="toast"></div>
        <div id="spectator" class="hidden"></div>
        <button class="sound-toggle" id="soundBtn" title="الصوت">🔊</button>
        <div id="overlayHost"></div>
      </section>

      <!-- النتائج -->
      <section id="screen-result" class="screen hidden">
        <div class="card" id="resultCard"></div>
      </section>

      <div id="rotate-hint">أدر جهازك أفقيًا لتجربة أفضل</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
